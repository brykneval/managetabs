<!doctype html>
<html>

<head>
    <title>Manage Tabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root, :root[data-theme="light"] {
            --border-color: #e5e7eb;
            --text-color: #374151;
            --bg-color: #ffffff;
            --hover-bg: #f3f4f6;
            --discarded-bg: #f9fafb;
        }

        :root[data-theme="dark"] {
            --border-color: #3c4043;
            --text-color: #ffffff;
            --bg-color: #202124;
            --hover-bg: #303134;
            --discarded-bg: #171717;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --border-color: #3c4043;
                --text-color: #ffffff;
                --bg-color: #202124;
                --hover-bg: #303134;
                --discarded-bg: #171717;
            }
        }

        body,
        input,
        button {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 8px;
            color: var(--text-color);
            background: var(--bg-color);
        }

        /* Control Section */
        .controls-group {
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        /* Tab List Section */
        #dvList {
            display: flex;
            flex-direction: column;
        }

        .tab-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            gap: 8px;
        }

        .tab-item.discarded {
            opacity: 0.4;
            background-color: var(--discarded-bg);
        }

        .tab-item.discarded:hover {
            opacity: 0.6;
            background-color: var(--hover-bg);
        }

        .tab-item:last-child {
            border-bottom: none;
        }

        .tab-item:hover {
            background-color: var(--hover-bg);
        }

        .tab-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            border: none;
            margin: 0;
        }

        .tab-title {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .tab-close,
        .tab-snooze,
        .tab-save {
            width: 14px;
            height: 14px;
            opacity: 0.5;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
        }

        .tab-close:hover,
        .tab-snooze:hover,
        .tab-save:hover {
            opacity: 1;
        }
    </style>
    <script src="managetab.js"></script>
</head>

<body>
    <div class="controls-group" style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0 12px 0;">
        <span id="mainLabel" style="font-size: 13px; font-weight: 600; color: var(--text-color);">Tabs</span>
        <div style="display: flex; gap: 8px;">
            <span id="btnThemeToggle" title="Toggle Theme" class="tab-save">
                <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="iconSun" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </span>
            <span id="btnClearAllSavedIcon" title="Clear All Saved Tabs" class="tab-save" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </span>
            <span id="btnRestoreAllIcon" title="Restore All Saved Tabs" class="tab-save" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </span>
            <span id="btnSaveAllIcon" title="Save All Tabs" class="tab-save">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </span>
            <span id="btnDiscardIcon" title="Discard Inactive Tabs" class="tab-snooze">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h6l-6 8h6"></path><path d="M14 4h6l-6 8h6"></path></svg>
            </span>
        </div>
    </div>
    <div id="savedTabsGroup" style="display: none; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 8px;">
        <div id="dvSavedList" style="display: flex; flex-direction: column;">
        </div>
    </div>
    <div id="dvList">
    </div>
</body>

</html>
