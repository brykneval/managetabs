<!doctype html>
<html>

<head>
    <title>Manage Tabs</title>
    <style>
        :root {
            --border-color: #e5e7eb;
            --text-color: #374151;
            --bg-color: #ffffff;
            --hover-bg: #f3f4f6;
            --primary-btn: #4b5563;
            --primary-btn-hover: #1f2937;
        }

        body,
        input,
        button {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 8px;
            color: var(--text-color);
            background: var(--bg-color);
        }

        /* Control Section */
        .controls-group {
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        .controls-summary {
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 0 12px 0;
            user-select: none;
            outline: none;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
        }

        .controls label {
            display: flex;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            gap: 6px;
        }

        input[type="text"] {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #9ca3af;
        }

        button {
            padding: 6px 12px;
            background-color: white;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            width: 100%;
        }

        button:hover {
            background-color: var(--hover-bg);
        }

        /* Tab List Section */
        #dvList {
            display: flex;
            flex-direction: column;
        }

        .tab-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            gap: 8px;
        }

        .tab-item.discarded {
            opacity: 0.5;
            background-color: var(--hover-bg);
        }

        .tab-item:last-child {
            border-bottom: none;
        }

        .tab-item:hover {
            background-color: var(--hover-bg);
        }

        .tab-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            border: none;
            margin: 0;
        }

        .tab-title {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .tab-close,
        .tab-snooze {
            width: 14px;
            height: 14px;
            opacity: 0.5;
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
        }

        .tab-close:hover,
        .tab-snooze:hover {
            opacity: 1;
        }
    </style>
    <script src="managetab.js"></script>
</head>

<body>
    <details class="controls-group">
        <summary class="controls-summary" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Options</span>
            <span id="btnDiscardIcon" title="Discard Inactive Tabs" class="tab-snooze">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
        </summary>
        <div class="controls">
            <input type="text" id="txtRemove" placeholder="Remove tabs containing text...">
            <button id="btnRemove" type="button">Remove Selected Tabs</button>
        </div>
    </details>
    <div id="dvList">
    </div>
</body>

</html>
